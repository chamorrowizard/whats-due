<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACADEMIC // Telemetry</title>
  <style>
    :root {
      --bg-color: #0d0f12;
      --card-bg: #161a22;
      --card-border: #262c38;
      --accent-color: #00f2fe;
      --accent-glow: rgba(0, 242, 254, 0.25);
      --danger-color: #ff4757;
      --text-main: #e1e6ed;
      --text-muted: #8c9ba5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Top Calendar Styling */
    .panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .calendar-header h2 {
      font-size: 1.1rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--accent-color);
    }

    .nav-btn {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .nav-btn:hover {
      border-color: var(--accent-color);
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      text-align: center;
    }

    .day-name {
      font-size: 0.75rem;
      color: var(--text-muted);
      padding-bottom: 6px;
      text-transform: uppercase;
    }

    .day-cell {
      background: rgba(255, 255, 255, 0.02);
      border-radius: 6px;
      padding: 10px 0;
      font-size: 0.85rem;
      position: relative;
      min-height: 42px;
    }

    .day-cell.today {
      border: 1px solid var(--accent-color);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .dot {
      width: 5px;
      height: 5px;
      background-color: var(--accent-color);
      border-radius: 50%;
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
    }

    /* Tasks Section Header */
    .tasks-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 3px solid var(--accent-color);
      padding-left: 12px;
      margin-bottom: 16px;
    }

    .tasks-header h3 {
      font-size: 1rem;
      letter-spacing: 2px;
    }

    .add-task-btn {
      background: var(--accent-color);
      color: #000;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.85rem;
    }

    /* Form Styling */
    .task-form {
      display: none;
      flex-direction: column;
      gap: 12px;
      background: rgba(0, 0, 0, 0.2);
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      border: 1px dashed var(--card-border);
    }

    .task-form.active {
      display: flex;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-group label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .task-form input {
      background: var(--bg-color);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 8px;
      border-radius: 6px;

    }

    .task-form button {
      background: var(--accent-color);
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Task Cards */
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .task-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .task-title {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .task-details {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .task-status {
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }

    .days-badge {
      font-size: 0.75rem;
      color: var(--accent-color);
      background: var(--accent-glow);
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: bold;
    }

    .days-badge.overdue {
      color: var(--danger-color);
      background: rgba(ff, 71, 87, 0.15);
    }

    .delete-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.8rem;
    }

    .delete-btn:hover {
      color: var(--danger-color);
    }

    /* Responsive adjustments */
    @media (min-width: 600px) {
      .task-form-row {
        display: flex;
        gap: 10px;
      }
      .task-form-row .form-group {
        flex: 1;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Calendar Panel -->
  <div class="panel">
    <div class="calendar-header">
      <button class="nav-btn" id="prev-month">‹</button>
      <h2 id="calendar-title"></h2>
      <button class="nav-btn" id="next-month">›</button>
    </div>
    <div class="calendar-grid" id="calendar-grid"></div>
  </div>

  <!-- Academic Tasks Panel -->
  <div class="panel">
    <div class="tasks-header">
      <div>
        <h3>ACADEMIC SYSTEM</h3>
        <span style="font-size: 0.75rem; color: var(--text-muted);">SORTED BY UPCOMING DUE DATE</span>
      </div>
      <button class="add-task-btn" id="toggle-form-btn">+ Add Task</button>
    </div>

    <!-- Task Input Form -->
    <form class="task-form" id="task-form">
      <div class="form-group">
        <label for="task-title">Assignment / Exam Title</label>
        <input type="text" id="task-title" placeholder="e.g., Security+ Quiz Ch. 3" required>
      </div>
      <div class="task-form-row">
        <div class="form-group">
          <label for="task-course">Course / Category</label>
          <input type="text" id="task-course" placeholder="e.g., CIT 101" required>
        </div>
        <div class="form-group">
          <label for="task-date">Due Date</label>
          <input type="date" id="task-date" required>
        </div>
      </div>
      <div class="form-group">
        <label for="task-notes">Notes / Requirements</label>
        <input type="text" id="task-notes" placeholder="e.g., Open note, 30 min limit">
      </div>
      <button type="submit">Save Task</button>
    </form>

    <!-- Task List -->
    <div class="task-list" id="task-list"></div>
  </div>
</div>

<script>
  // Initial Academic State stored locally in the browser
  let tasks = JSON.parse(localStorage.getItem('academic_tasks')) || [
    
  ];

  let currentDate = new Date();

  // Core Logic Functions
  function saveTasks() {
    localStorage.setItem('academic_tasks', JSON.stringify(tasks));
  }

  function getDaysRemaining(dueDateStr) {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const due = new Date(dueDateStr + 'T00:00:00');
    const diffTime = due - today;
    return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
  }

  function renderTasks() {
    const taskListEl = document.getElementById('task-list');
    taskListEl.innerHTML = '';

    // Sort tasks by nearest due date
    tasks.sort((a, b) => new Date(a.date) - new Date(b.date));

    tasks.forEach(task => {
      const days = getDaysRemaining(task.date);
      const isOverdue = days < 0;
      
      let badgeText = '';
      if (days === 0) badgeText = 'DUE TODAY';
      else if (days === 1) badgeText = '1 day remaining';
      else if (isOverdue) badgeText = `${Math.abs(days)} days overdue`;
      else badgeText = `${days} days remaining`;

      const card = document.createElement('div');
      card.className = 'task-card';
      card.innerHTML = `
        <div class="task-info">
          <div class="task-title">${task.title}</div>
          <div class="task-details">${task.course} • ${task.date} ${task.notes ? '• ' + task.notes : ''}</div>
        </div>
        <div class="task-status">
          <span class="days-badge ${isOverdue ? 'overdue' : ''}">${badgeText}</span>
          <button class="delete-btn" onclick="deleteTask(${task.id})">Complete / Remove</button>
        </div>
      `;
      taskListEl.appendChild(card);
    });

    renderCalendar();
  }

  function renderCalendar() {
    const grid = document.getElementById('calendar-grid');
    const title = document.getElementById('calendar-title');
    grid.innerHTML = '';

    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    const monthNames = ["January", "February", "March", "April", "May", "June", 
                        "July", "August", "September", "October", "November", "December"];
    title.textContent = `${monthNames[month]} ${year}`;

    // Add Day Name Headers
    const dayNames = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
    dayNames.forEach(d => {
      const el = document.createElement('div');
      el.className = 'day-name';
      el.textContent = d;
      grid.appendChild(el);
    });

    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    // Empty padding slots
    for (let i = 0; i < firstDay; i++) {
      grid.appendChild(document.createElement('div'));
    }

    const today = new Date();

    // Fill days
    for (let day = 1; day <= daysInMonth; day++) {
      const cell = document.createElement('div');
      cell.className = 'day-cell';
      cell.textContent = day;

      const cellDateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;

      // Check if Today
      if (today.getFullYear() === year && today.getMonth() === month && today.getDate() === day) {
        cell.classList.add('today');
      }

      // Check for Task Indicator
      const hasTask = tasks.some(t => t.date === cellDateStr);
      if (hasTask) {
        const dot = document.createElement('div');
        dot.className = 'dot';
        cell.appendChild(dot);
      }

      grid.appendChild(cell);
    }
  }

  function deleteTask(id) {
    tasks = tasks.filter(t => t.id !== id);
    saveTasks();
    renderTasks();
  }

  // Event Listeners
  document.getElementById('toggle-form-btn').addEventListener('click', () => {
    const form = document.getElementById('task-form');
    form.classList.toggle('active');
  });

  document.getElementById('task-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const newTask = {
      id: Date.now(),
      title: document.getElementById('task-title').value,
      course: document.getElementById('task-course').value,
      date: document.getElementById('task-date').value,
      notes: document.getElementById('task-notes').value
    };
    tasks.push(newTask);
    saveTasks();
    renderTasks();
    
    // Reset and hide form
    e.target.reset();
    document.getElementById('task-form').classList.remove('active');
  });

  document.getElementById('prev-month').addEventListener('click', () => {
    currentDate.setMonth(currentDate.getMonth() - 1);
    renderCalendar();
  });

  document.getElementById('next-month').addEventListener('click', () => {
    currentDate.setMonth(currentDate.getMonth() + 1);
    renderCalendar();
  });

  // Initial Load
  renderTasks();
</script>
</body>
</html>
