<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACADEMIC // Telemetry</title>
  <style>
    :root {
      --bg-color: #0d0f12;
      --card-bg: #161a22;
      --card-border: #262c38;
      --accent-color: #00f2fe;
      --accent-glow: rgba(0, 242, 254, 0.25);
      --danger-color: #ff4757;
      --text-main: #e1e6ed;
      --text-muted: #8c9ba5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Top Calendar Styling */
    .panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .calendar-header h2 {
      font-size: 1.1rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--accent-color);
    }

    .nav-btn {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .nav-btn:hover {
      border-color: var(--accent-color);
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      text-align: center;
    }

    .day-name {
      font-size: 0.75rem;
      color: var(--text-muted);
      padding-bottom: 6px;
      text-transform: uppercase;
    }

    .day-cell {
      background: rgba(255, 255, 255, 0.02);
      border-radius: 6px;
      padding: 10px 0;
      font-size: 0.85rem;
      position: relative;
      min-height: 42px;
    }

    .day-cell.today {
      border: 1px solid var(--accent-color);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .dot {
      width: 5px;
      height: 5px;
      background-color: var(--accent-color);
      border-radius: 50%;
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
    }

    /* Tasks Section Header */
    .tasks-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 3px solid var(--accent-color);
      padding-left: 12px;
      margin-bottom: 16px;
    }

    .tasks-header h3 {
      font-size: 1rem;
      letter-spacing: 2px;
    }

    .add-task-btn {
      background: var(--accent-color);
      color: #000;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.85rem;
    }

    /* Form Styling */
    .task-form {
      display: none;
      flex-direction: column;
      gap: 12px;
      background: rgba(0, 0, 0, 0.2);
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      border: 1px dashed var(--card-border);
    }

    .task-form.active {
      display: flex;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-group label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .task-form input {
      background: var(--bg-color);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 8px;
      border-radius: 6px;

    }

    .task-form button {
      background: var(--accent-color);
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Task Cards */
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .task-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .task-title {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .task-details {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .task-status {
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }

    .days-badge {
      font-size: 0.75rem;
      color: var(--accent-color);
      background: var(--accent-glow);
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: bold;
    }

    .days-badge.overdue {
      color: var(--danger-color);
      background: rgba(255, 71, 87, 0.15);
    }

    /* Action Buttons */
    .task-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .action-btn {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .action-btn.edit-btn:hover {
      border-color: var(--accent-color);
      color: var(--accent-color);
      background: var(--accent-glow);
    }

    .action-btn.complete-btn:hover {
      border-color: var(--danger-color);
      color: var(--danger-color);
      background: rgba(255, 71, 87, 0.15);
    }

    .course-tag {
      color: var(--accent-color);
      font-weight: 600;
    }

    /* Folder Styling */
    .folder-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .folder-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: grab;
      transition: background 0.2s, border-color 0.2s, transform 0.15s ease;
    }

    .folder-item:hover {
      border-color: var(--accent-color);
      background: rgba(0, 242, 254, 0.03);
    }

    .folder-item.dragging {
      opacity: 0.4;
      cursor: grabbing;
      border-color: var(--accent-color);
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .folder-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .drag-handle {
      color: var(--text-muted);
      cursor: grab;
      font-size: 1.1rem;
      user-select: none;
    }

    .folder-name {
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--text-main);
      outline: none;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .folder-name[contenteditable="true"] {
      background: var(--bg-color);
      border: 1px solid var(--accent-color);
      box-shadow: 0 0 6px var(--accent-glow);
      color: #fff;
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(13, 15, 18, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 100;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 24px;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8), 0 0 15px var(--accent-glow);
    }

    .modal-title {
      font-size: 0.95rem;
      letter-spacing: 1.5px;
      color: var(--accent-color);
      font-weight: bold;
      margin-bottom: 10px;
    }

    .modal-message {
      font-size: 0.85rem;
      color: var(--text-main);
      line-height: 1.4;
      margin-bottom: 20px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .modal-btn {
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
      border: none;
    }

    .modal-btn.cancel {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--card-border);
    }

    .modal-btn.cancel:hover {
      border-color: var(--text-main);
      color: var(--text-main);
    }

    .modal-btn.confirm {
      background: var(--accent-color);
      color: #000;
    }

    .modal-btn.confirm:hover {
      box-shadow: 0 0 10px var(--accent-glow);
    }

    /* Responsive adjustments */
    @media (min-width: 600px) {
      .task-form-row {
        display: flex;
        gap: 10px;
      }
      .task-form-row .form-group {
        flex: 1;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Calendar Panel -->
  <div class="panel">
    <div class="calendar-header">
      <button class="nav-btn" id="prev-month">‹</button>
      <h2 id="calendar-title"></h2>
      <button class="nav-btn" id="next-month">›</button>
    </div>
    <div class="calendar-grid" id="calendar-grid"></div>
  </div>

  <!-- Academic Tasks Panel -->
  <div class="panel">
    <div class="tasks-header">
      <div>
        <h3>ACADEMIC SYSTEM</h3>
        <span style="font-size: 0.75rem; color: var(--text-muted);">SORTED BY UPCOMING DUE DATE</span>
      </div>
      <button class="add-task-btn" id="toggle-form-btn">+ Add Task</button>
    </div>

    <!-- Task Input Form -->
    <form class="task-form" id="task-form">
      <input type="hidden" id="task-id">
      <div style="font-size: 0.8rem; letter-spacing: 1px; color: var(--accent-color); font-weight: bold; margin-bottom: 4px;" id="form-title">NEW TASK</div>
      <div class="form-group">
        <label for="task-title">Assignment / Exam Title</label>
        <input type="text" id="task-title" placeholder="e.g., Security+ Quiz Ch. 3" required>
      </div>
      <div class="task-form-row">
        <div class="form-group">
          <label for="task-course">Course / Category</label>
          <input type="text" id="task-course" placeholder="e.g., CIT 101" required>
        </div>
        <div class="form-group">
          <label for="task-date">Due Date</label>
          <input type="date" id="task-date" required>
        </div>
      </div>
      <div class="form-group">
        <label for="task-notes">Notes / Requirements</label>
        <input type="text" id="task-notes" placeholder="e.g., Open note, 30 min limit">
      </div>
      <button type="submit" id="submit-btn">Save Task</button>
    </form>

    <!-- Task List -->
    <div class="task-list" id="task-list"></div>
  </div>

  <!-- Folders Panel -->
  <div class="panel">
    <div class="tasks-header">
      <div>
        <h3>FOLDERS</h3>
        <span style="font-size: 0.75rem; color: var(--text-muted);">DRAG TO REORDER OR DOUBLE CLICK TO EDIT</span>
      </div>
      <button class="add-task-btn" id="add-folder-btn">+ Add Folder</button>
    </div>

    <div class="folder-list" id="folder-list"></div>
  </div>
</div>

<!-- Confirmation Modal -->
<div class="modal-overlay" id="confirm-modal">
  <div class="modal-card">
    <div class="modal-title">COMPLETE TASK</div>
    <div class="modal-message">Are you sure you want to mark this task as completed? This action will remove it from your telemetry dashboard.</div>
    <div class="modal-actions">
      <button class="modal-btn cancel" id="cancel-complete-btn">Cancel</button>
      <button class="modal-btn confirm" id="confirm-complete-btn">Confirm Complete</button>
    </div>
  </div>
</div>

<script>
  let tasks = JSON.parse(localStorage.getItem('academic_tasks')) || [];
  let folders = JSON.parse(localStorage.getItem('academic_folders')) || [
    { id: 1, name: 'ENG102 MAIN' },
    { id: 2, name: '#Notes' },
    { id: 3, name: 'Tools for your convenience' }
  ];
  let currentDate = new Date();
  let taskToDeleteId = null;

  function saveTasks() {
    localStorage.setItem('academic_tasks', JSON.stringify(tasks));
  }

  function saveFolders() {
    localStorage.setItem('academic_folders', JSON.stringify(folders));
  }

  function renderFolders() {
    const container = document.getElementById('folder-list');
    container.innerHTML = '';

    folders.forEach((folder, index) => {
      const el = document.createElement('div');
      el.className = 'folder-item';
      el.draggable = true;
      el.dataset.index = index;

      el.innerHTML = `
        <div class="folder-left">
          <span class="drag-handle">⋮⋮</span>
          <span class="folder-name" id="folder-title-${folder.id}">${folder.name}</span>
        </div>
        <div class="task-actions">
          <button class="action-btn edit-btn" onclick="enableFolderEdit(${folder.id})">Edit</button>
          <button class="action-btn complete-btn" onclick="deleteFolder(${folder.id})">Delete</button>
        </div>
      `;

      el.addEventListener('dragstart', (e) => {
        el.classList.add('dragging');
        e.dataTransfer.setData('text/plain', index);
      });

      el.addEventListener('dragend', () => el.classList.remove('dragging'));

      el.addEventListener('dragover', (e) => {
        e.preventDefault();
        const draggingEl = document.querySelector('.dragging');
        if (!draggingEl || draggingEl === el) return;

        const items = [...container.querySelectorAll('.folder-item')];
        const nextSibling = items.find(sibling => {
          return e.clientY <= sibling.getBoundingClientRect().top + sibling.offsetHeight / 2;
        });

        if (nextSibling) container.insertBefore(draggingEl, nextSibling);
        else container.appendChild(draggingEl);
      });

      el.addEventListener('drop', () => {
        const updatedFolders = [];
        container.querySelectorAll('.folder-item').forEach(item => {
          const idx = item.dataset.index;
          updatedFolders.push(folders[idx]);
        });
        folders = updatedFolders;
        saveFolders();
        renderFolders();
      });

      el.addEventListener('dblclick', () => enableFolderEdit(folder.id));
      container.appendChild(el);
    });
  }

  function enableFolderEdit(id) {
    const nameEl = document.getElementById(`folder-title-${id}`);
    if (!nameEl) return;

    nameEl.contentEditable = 'true';
    nameEl.focus();

    const saveEdit = () => {
      nameEl.contentEditable = 'false';
      const folder = folders.find(f => f.id === id);
      if (folder) {
        folder.name = nameEl.textContent.trim() || folder.name;
        saveFolders();
      }
      renderFolders();
    };

    nameEl.addEventListener('blur', saveEdit, { once: true });
    nameEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        nameEl.blur();
      }
    });
  }

  function deleteFolder(id) {
    folders = folders.filter(f => f.id !== id);
    saveFolders();
    renderFolders();
  }

  function getDaysRemaining(dueDateStr) {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const due = new Date(dueDateStr + 'T00:00:00');
    const diffTime = due - today;
    return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
  }

  function renderTasks() {
    const taskListEl = document.getElementById('task-list');
    taskListEl.innerHTML = '';

    tasks.sort((a, b) => new Date(a.date) - new Date(b.date));

    tasks.forEach(task => {
      const days = getDaysRemaining(task.date);
      const isOverdue = days < 0;
      
      let badgeText = '';
      if (days === 0) badgeText = 'DUE TODAY';
      else if (days === 1) badgeText = '1 day remaining';
      else if (isOverdue) badgeText = `${Math.abs(days)} days overdue`;
      else badgeText = `${days} days remaining`;

      const card = document.createElement('div');
      card.className = 'task-card';
      card.innerHTML = `
        <div class="task-info">
          <div class="task-title">${task.title}</div>
          <div class="task-details"><span class="course-tag">${task.course}</span> • ${task.date} ${task.notes ? '• ' + task.notes : ''}</div>
        </div>
        <div class="task-status">
          <span class="days-badge ${isOverdue ? 'overdue' : ''}">${badgeText}</span>
          <div class="task-actions">
            <button class="action-btn edit-btn" onclick="editTask(${task.id})">Edit</button>
            <button class="action-btn complete-btn" onclick="promptCompleteTask(${task.id})">Complete</button>
          </div>
        </div>
      `;
      taskListEl.appendChild(card);
    });

    renderCalendar();
  }

  function renderCalendar() {
    const grid = document.getElementById('calendar-grid');
    const title = document.getElementById('calendar-title');
    grid.innerHTML = '';

    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    const monthNames = ["January", "February", "March", "April", "May", "June", 
                        "July", "August", "September", "October", "November", "December"];
    title.textContent = `${monthNames[month]} ${year}`;

    // Add Day Name Headers
    const dayNames = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
    dayNames.forEach(d => {
      const el = document.createElement('div');
      el.className = 'day-name';
      el.textContent = d;
      grid.appendChild(el);
    });

    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    // Empty padding slots
    for (let i = 0; i < firstDay; i++) {
      grid.appendChild(document.createElement('div'));
    }

    const today = new Date();

    // Fill days
    for (let day = 1; day <= daysInMonth; day++) {
      const cell = document.createElement('div');
      cell.className = 'day-cell';
      cell.textContent = day;

      const cellDateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;

      // Check if Today
      if (today.getFullYear() === year && today.getMonth() === month && today.getDate() === day) {
        cell.classList.add('today');
      }

      // Check for Task Indicator
      const hasTask = tasks.some(t => t.date === cellDateStr);
      if (hasTask) {
        const dot = document.createElement('div');
        dot.className = 'dot';
        cell.appendChild(dot);
      }

      grid.appendChild(cell);
    }
  }

  function editTask(id) {
    const task = tasks.find(t => t.id === id);
    if (!task) return;

    document.getElementById('task-id').value = task.id;
    document.getElementById('task-title').value = task.title;
    document.getElementById('task-course').value = task.course;
    document.getElementById('task-date').value = task.date;
    document.getElementById('task-notes').value = task.notes || '';

    document.getElementById('form-title').textContent = 'EDIT TASK';
    document.getElementById('submit-btn').textContent = 'Update Task';
    document.getElementById('task-form').classList.add('active');
  }

  function resetForm() {
    const form = document.getElementById('task-form');
    form.reset();
    document.getElementById('task-id').value = '';
    document.getElementById('form-title').textContent = 'NEW TASK';
    document.getElementById('submit-btn').textContent = 'Save Task';
    form.classList.remove('active');
  }

  function promptCompleteTask(id) {
    taskToDeleteId = id;
    document.getElementById('confirm-modal').classList.add('active');
  }

  function closeConfirmModal() {
    taskToDeleteId = null;
    document.getElementById('confirm-modal').classList.remove('active');
  }

  function confirmCompleteTask() {
    if (taskToDeleteId !== null) {
      tasks = tasks.filter(t => t.id !== taskToDeleteId);
      saveTasks();
      renderTasks();
    }
    closeConfirmModal();
  }

  // Event Listeners
  document.getElementById('toggle-form-btn').addEventListener('click', () => {
    const form = document.getElementById('task-form');
    if (form.classList.contains('active')) {
      resetForm();
    } else {
      resetForm();
      form.classList.add('active');
    }
  });

  document.getElementById('task-form').addEventListener('submit', (e) => {
    e.preventDefault();

    const idInput = document.getElementById('task-id').value;
    if (idInput) {
      const id = parseInt(idInput, 10);
      const index = tasks.findIndex(t => t.id === id);
      if (index !== -1) {
        tasks[index] = {
          id,
          title: document.getElementById('task-title').value,
          course: document.getElementById('task-course').value,
          date: document.getElementById('task-date').value,
          notes: document.getElementById('task-notes').value
        };
      }
    } else {
      tasks.push({
        id: Date.now(),
        title: document.getElementById('task-title').value,
        course: document.getElementById('task-course').value,
        date: document.getElementById('task-date').value,
        notes: document.getElementById('task-notes').value
      });
    }

    saveTasks();
    renderTasks();
    resetForm();
  });

  document.getElementById('confirm-complete-btn').addEventListener('click', confirmCompleteTask);
  document.getElementById('cancel-complete-btn').addEventListener('click', closeConfirmModal);

  document.getElementById('prev-month').addEventListener('click', () => {
    currentDate.setMonth(currentDate.getMonth() - 1);
    renderCalendar();
  });

  document.getElementById('next-month').addEventListener('click', () => {
    currentDate.setMonth(currentDate.getMonth() + 1);
    renderCalendar();
  });

  document.getElementById('add-folder-btn').addEventListener('click', () => {
    const newFolder = { id: Date.now(), name: 'New Folder' };
    folders.push(newFolder);
    saveFolders();
    renderFolders();
    enableFolderEdit(newFolder.id);
  });

  // Initial Load
  renderTasks();
  renderFolders();
</script>
</body>
</html>
